name: 每日更新电力市场政策数据

on:
  schedule:
    # UTC 时间每天 05:00 运行（对应北京时间13:00 / 巴黎时间夏令06:00或07:00）
    # 需要的话自己改这个 cron 表达式，https://crontab.guru 可以帮你算
    - cron: "37 5 * * *"
  workflow_dispatch: {}  # 允许在 GitHub 网页上手动点一下触发，方便测试

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scraper.scrape

      - name: 提交更新后的数据库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/policy.db
          git diff --quiet --cached || git commit -m "chore: 自动更新电力市场政策数据 $(date -u +%Y-%m-%d)"
          git push
